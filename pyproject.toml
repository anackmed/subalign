[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anackmed-subalign"
version = "0.1.0"
description = "通过字符级与结构级特征识别视频字幕的时间对齐的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "anackmed" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://anackmed.github.io"
Repository = "https://github.com/anackmed/subalign"
Issues = "https://github.com/anackmed/subalign/issues"

[project.scripts]
subalign = "subalign:main"

[tool.setuptools]
py-modules = ["subalign"]
